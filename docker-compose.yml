services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: predictive_inventory
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: predictive_inventory
      DB_USERNAME: root
      DB_PASSWORD: ""
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SANCTUM_STATEFUL_DOMAINS: "localhost:5188,127.0.0.1:5188"
      FRONTEND_URL: "http://localhost:5188"
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/var/www/html

volumes:
  mysql_data:
